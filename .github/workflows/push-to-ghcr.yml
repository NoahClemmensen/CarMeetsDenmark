name: Build and Push to GHCR

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Image tag to use'
                required: true
                default: 'manual'

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            -   name: set lower case owner name
                run: |
                    echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
                env:
                    OWNER: '${{ github.repository_owner }}'

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            -   name: set lower case owner name
                run: |
                    echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
                env:
                    OWNER: '${{ github.repository_owner }}'

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      ghcr.io/${{ env.OWNER_LC }}/carmeetsdenmark:${{ github.event.release.tag_name || inputs.tag }}
                      ghcr.io/${{ env.OWNER_LC }}/carmeetsdenmark:latest
