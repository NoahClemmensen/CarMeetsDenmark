# Danish translations for custom validation constraint messages.
# Keyed by the exact English message used in the DTOs/form types (the
# `validators` domain looks them up by that string). Symfony ships Danish for
# its built-in constraint messages; only the app's custom messages live here.
# Keep {{ limit }} and other {{ ... }} placeholders intact.

'Name is required.': Navn er påkrævet.
'Description is required.': Beskrivelse er påkrævet.
'Description is too long. Max character limit is {{ limit }}.': Beskrivelsen er for lang. Den maksimale tegngrænse er {{ limit }}.
'Location is required.': Lokation er påkrævet.
'Start date is required.': Startdato er påkrævet.
'End date must be after the start date.': Slutdato skal være efter startdatoen.
'Repeat amount must be a positive number.': Gentagelsesantal skal være et positivt tal.
'Invalid timezone.': Ugyldig tidszone.
'Invalid language format.': Ugyldigt sprogformat.
'Team name is required.': Teamnavn er påkrævet.
'Link must be a valid https URL.': Linket skal være en gyldig https-URL.
'Post body cannot exceed 2000 characters.': Opslagets tekst må ikke overstige 2000 tegn.
'You can attach at most 4 images.': Du kan vedhæfte højst 4 billeder.
'Each image must be JPEG, PNG, GIF, or WEBP under 5MB.': Hvert billede skal være JPEG, PNG, GIF eller WEBP og under 5MB.
'Please upload a JPEG, PNG, GIF, or WEBP image.': Upload venligst et JPEG-, PNG-, GIF- eller WEBP-billede.
'Please upload a valid image (JPEG, PNG, GIF, or WEBP) up to 4MB.': Upload venligst et gyldigt billede (JPEG, PNG, GIF eller WEBP) på op til 4MB.
'Please upload a valid image file (JPEG, PNG, GIF, or WEBP) with a maximum size of 4MB.': Upload venligst en gyldig billedfil (JPEG, PNG, GIF eller WEBP) på maksimalt 4MB.
'Please enter a password': Indtast venligst en adgangskode
'Your password should be at least {{ limit }} characters': Din adgangskode skal være mindst {{ limit }} tegn
'You should agree to our terms.': Du skal acceptere vores betingelser.
'Please enter your current password.': Indtast venligst din nuværende adgangskode.
'Your current password is incorrect.': Din nuværende adgangskode er forkert.
'Please enter a new password.': Indtast venligst en ny adgangskode.
'The passwords do not match': Adgangskoderne er ikke ens
'The new passwords do not match.': De nye adgangskoder er ikke ens.
'Start date cannot be in the past.': Startdato kan ikke være i fortiden.
'Post cannot be empty. Add text, a link, an embed, or images.': Opslag kan ikke være tomt. Tilføj tekst, et link, et indlejret medie eller billeder.
'A post can contain images OR an embed, not both.': Et opslag kan indeholde billeder ELLER et indlejret medie, ikke begge.
